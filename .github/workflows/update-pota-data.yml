name: Update POTA park data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-pota-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch park data
        run: |
          mkdir -p data
          curl -fsSL https://api.pota.app/program/parks/NO -o data/pota-NO.json
          curl -fsSL https://api.pota.app/program/parks/SE -o data/pota-SE.json
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pota-NO.json data/pota-SE.json
          git diff --cached --quiet || git commit -m 'Update POTA park data'
          git push
