name: Export Hvaler trails
on:
  push:
    branches: [main]
    paths:
      - 'Hvaler-redigering.gpkg'
      - 'scripts/export-hvaler.py'
      - 'app-core.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install shapely==2.1.2 pyproj==3.7.2
      - run: python scripts/export-hvaler.py
      - name: Commit generated geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hvaler/hvaler-tillegg.geojson
          git diff --cached --quiet && exit 0
          git commit -m 'data: export Hvaler additions from GeoPackage'
          git pull --rebase origin main
          git push origin HEAD:main
