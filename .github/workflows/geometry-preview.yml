name: Build geometry test map
on:
  push:
    branches: ['feature/all-park-geometries']
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'scripts/update-geometries.py'
      - 'scripts/test-geometries.py'
      - 'scripts/test-atlas.cjs'
      - '.github/workflows/geometry-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: geometry-test-map
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/all-park-geometries
          path: candidate
      - uses: actions/cache@v4
        with:
          path: candidate/.geometry-source-cache
          key: geometry-sources-${{ github.run_id }}
          restore-keys: geometry-sources-
      - name: Refresh geometry datasets
        working-directory: candidate
        run: |
          python3 scripts/update-geometries.py
          python3 scripts/test-geometries.py
          node --check app-core.js
          node --check geometry-atlas.js
          node --check mobile-ui.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/pota-test playwright@1.56.1
          /tmp/pota-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test desktop and mobile map
        working-directory: candidate
        env:
          NODE_PATH: /tmp/pota-test/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pota-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          timeout 300 node scripts/test-atlas.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-browser-checks
          path: candidate/atlas-*.png
      - name: Save verified geometry on the feature branch
        working-directory: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/geometries
          git diff --cached --quiet || git commit -m 'Refresh verified geometry for geometry test map'
          git push origin HEAD:feature/all-park-geometries
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Publish isolated test directory
        run: |
          mkdir -p stable/test/all-geometries
          for file in index.html app.js app-core.js geometry-atlas.js pota-cache-bootstrap.js mobile-ui.js styles.css mobile-ui.css manifest.webmanifest; do
            cp "candidate/$file" "stable/test/all-geometries/$file"
          done
          cp -R candidate/data stable/test/all-geometries/
          cd stable
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/all-geometries
          git diff --cached --quiet || git commit -m 'Publish isolated geometry test map'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
