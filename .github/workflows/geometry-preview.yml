name: Verify POTA map
on:
  push:
    branches: ['main', 'develop', 'feature/all-park-geometries', 'refactor/core-geometry-helpers', 'test/pc-ui', 'test/mobile-ui', 'test/activated-parks', 'test/oslofjorden-coast']
    paths:
      - '*.js'
      - 'scripts/test-diagnostics.cjs'
      - 'scripts/test-geojson-utils.cjs'
      - 'scripts/test-module-wiring.cjs'
      - '*.html'
      - '*.css'
      - 'scripts/update-geometries.py'
      - 'scripts/test-geometries.py'
      - 'scripts/test-atlas.cjs'
      - 'scripts/test-gps-compass.cjs'
      - 'scripts/test-kyst-ui.cjs'
      - 'scripts/test-mobile-ui.cjs'
      - 'scripts/test-park-display.cjs'
      - 'scripts/test-startup-position.cjs'
      - 'scripts/test-park-activations.cjs'
      - 'scripts/test-overlap-engine.cjs'
      - 'scripts/import-oslofjorden-coast.py'
      - 'scripts/test-oslofjorden-coast.py'
      - 'scripts/test-oslofjorden-coast.cjs'
      - 'data/coastal/**'
      - '.github/workflows/geometry-preview.yml'
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pota-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
      - uses: actions/cache@v4
        with:
          path: candidate/.geometry-source-cache
          key: geometry-sources-${{ github.run_id }}
          restore-keys: geometry-sources-
      - name: Refresh geometry datasets
        if: github.ref == 'refs/heads/feature/all-park-geometries'
        working-directory: candidate
        run: |
          python3 scripts/update-geometries.py
      - name: Validate cached geometry and JavaScript
        working-directory: candidate
        run: |
          python3 scripts/test-geometries.py
          python3 scripts/test-oslofjorden-coast.py
          node --check diagnostics.js
          node --check geojson-utils.js
          node --check map-setup.js
          node --check map-layers.js
          node --check gps-controller.js
          node --check scripts/test-gps-compass.cjs
          node scripts/test-module-wiring.cjs
          node scripts/test-geojson-utils.cjs
          node --check polygon-layer-utils.js
          node --check pota-activation.js
          node --check park-info-ui.js
          node --check app-text-utils.js
          node --check norway-park-registry.js
          node --check sweden-park-registry.js
          node --check geometry-format-utils.js
          node --check sweden-heritage-registry.js
          node --check park-diagnostics.js
          node --check park-selection-state.js
          node --check pota-park-loader.js
          node --check park-selection-controller.js
          node --check pota-startup.js
          node --check app-core.js
          node scripts/test-diagnostics.cjs
          node --check geometry-atlas.js
          node --check geometry-topology.js
          node --check overlap-engine.js
          node --check overlap-worker.js
          node --check mobile-ui.js
          node --check park-activations.js
          if [ -f desktop-ui.js ]; then node --check desktop-ui.js; fi
      - name: Save verified geometry on the feature branch
        if: github.ref == 'refs/heads/feature/all-park-geometries'
        working-directory: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/geometries
          git diff --cached --quiet || git commit -m 'Refresh verified geometry for geometry test map'
          git push origin HEAD:feature/all-park-geometries
      - uses: actions/cache/save@v4
        with:
          path: candidate/.geometry-source-cache
          key: geometry-sources-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/pota-test playwright@1.56.1 @turf/turf@6.5.0 polygon-clipping@0.15.7
          /tmp/pota-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test desktop and mobile map
        working-directory: candidate
        env:
          NODE_PATH: /tmp/pota-test/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pota-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          node scripts/test-overlap-engine.cjs
          timeout 300 node scripts/test-atlas.cjs
          timeout 180 node scripts/test-gps-compass.cjs
          timeout 180 node scripts/test-kyst-ui.cjs
          if [ -f scripts/test-mobile-ui.cjs ]; then timeout 180 node scripts/test-mobile-ui.cjs; fi
          timeout 180 node scripts/test-park-activations.cjs
          timeout 180 node scripts/test-oslofjorden-coast.cjs
          timeout 180 node scripts/test-park-display.cjs
          timeout 180 node scripts/test-startup-position.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-browser-checks
          path: candidate/atlas-*.png
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/all-park-geometries' || github.ref == 'refs/heads/refactor/core-geometry-helpers' || github.ref == 'refs/heads/test/pc-ui' || github.ref == 'refs/heads/test/mobile-ui' || github.ref == 'refs/heads/test/activated-parks' || github.ref == 'refs/heads/test/oslofjorden-coast'
        with:
          ref: main
          path: stable
      - name: Publish isolated test directory
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/all-park-geometries' || github.ref == 'refs/heads/refactor/core-geometry-helpers' || github.ref == 'refs/heads/test/pc-ui' || github.ref == 'refs/heads/test/mobile-ui' || github.ref == 'refs/heads/test/activated-parks' || github.ref == 'refs/heads/test/oslofjorden-coast'
        run: |
          DEST=all-geometries
          if [ "${{ github.ref }}" = 'refs/heads/develop' ]; then DEST=develop; fi
          if [ "${{ github.ref }}" = 'refs/heads/refactor/core-geometry-helpers' ]; then DEST=code-refactor; fi
          if [ "${{ github.ref }}" = 'refs/heads/test/pc-ui' ]; then DEST=pc-ui; fi
          if [ "${{ github.ref }}" = 'refs/heads/test/mobile-ui' ]; then DEST=mobile-ui; fi
          if [ "${{ github.ref }}" = 'refs/heads/test/activated-parks' ]; then DEST=activated-parks; fi
          if [ "${{ github.ref }}" = 'refs/heads/test/oslofjorden-coast' ]; then DEST=oslofjorden-coast; fi
          mkdir -p "stable/test/$DEST"
          for file in index.html app.js app-core.js diagnostics.js geojson-utils.js map-setup.js map-layers.js gps-controller.js polygon-layer-utils.js pota-activation.js park-activations.js park-info-ui.js app-text-utils.js norway-park-registry.js sweden-park-registry.js geometry-format-utils.js sweden-heritage-registry.js park-diagnostics.js park-selection-state.js pota-park-loader.js park-selection-controller.js pota-startup.js geometry-atlas.js geometry-topology.js overlap-worker.js overlap-engine.js pota-cache-bootstrap.js mobile-ui.js styles.css mobile-ui.css manifest.webmanifest; do
            cp "candidate/$file" "stable/test/$DEST/$file"
          done
          if [ -f candidate/desktop-ui.js ]; then cp candidate/desktop-ui.js "stable/test/$DEST/"; fi
          cp -R candidate/data "stable/test/$DEST/"
          if [ "${{ github.ref }}" = 'refs/heads/develop' ]; then
            python3 - "stable/test/$DEST" "${{ github.sha }}" <<'PYDEV'
          import pathlib, re, sys
          folder, revision = pathlib.Path(sys.argv[1]), sys.argv[2]
          html = folder / 'index.html'
          text = html.read_text()
          text = re.sub(r'((?:app\.js|styles\.css|mobile-ui\.css)\?v=)[^"\s]+', lambda m: m.group(1) + revision, text)
          html.write_text(text)
          script = folder / 'app.js'
          script.write_text(re.sub(r'(\.js\?v=)[^\x27"\s]+', lambda m: m.group(1) + revision, script.read_text()))
          PYDEV
          fi
          cd stable
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "test/$DEST"
          git diff --cached --quiet || git commit -m 'Publish isolated POTA test map'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request GitHub Pages publication
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/all-park-geometries' || github.ref == 'refs/heads/refactor/core-geometry-helpers' || github.ref == 'refs/heads/test/pc-ui' || github.ref == 'refs/heads/test/mobile-ui' || github.ref == 'refs/heads/test/activated-parks' || github.ref == 'refs/heads/test/oslofjorden-coast'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
